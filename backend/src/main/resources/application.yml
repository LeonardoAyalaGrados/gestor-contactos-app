spring:
  application:
    name: gestor-contactos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gestor_contactos}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
