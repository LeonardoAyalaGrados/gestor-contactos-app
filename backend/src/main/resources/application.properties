# Carga el archivo local de la raíz al ejecutar desde la raíz o desde backend/.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.application.name=gestor-contactos

# MySQL. En producción, proporcionar DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestor_contactos?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En local, prepara la collation antes de que Hibernate cree tablas. En producción,
# aprovisionar previamente la base con utf8mb4_unicode_ci y usar SQL_INIT_MODE=never.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=false

# Esquema inicial gestionado por Hibernate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8080}
# En desarrollo local, la API queda enlazada a loopback por defecto.
server.address=${SERVER_ADDRESS:127.0.0.1}

# CORS para el cliente Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.api.prefix=${API_PREFIX:/api/v1}

# Almacenamiento local fuera del código fuente.
app.uploads.contact-photos-dir=${CONTACT_PHOTO_DIRECTORY:./uploads/contactos}
app.photos.max-bytes=${PHOTO_MAX_BYTES:2097152}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:3MB}

# JWT. Use un valor aleatorio de al menos 32 bytes en JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Semilla del usuario inicial. La contraseña no tiene valor por defecto para evitar credenciales compartidas.
app.admin.initial-username=${ADMIN_INITIAL_USERNAME:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
